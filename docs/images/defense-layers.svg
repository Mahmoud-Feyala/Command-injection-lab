<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 420" role="img" aria-labelledby="title desc">
  <title id="title">Command injection defense layers</title>
  <desc id="desc">Four defenses protect log search: avoid the shell, enforce input length, allow safe characters, and return controlled errors.</desc>
  <rect width="1000" height="420" rx="24" fill="#f4f7f5"/>
  <text x="60" y="62" fill="#101817" font-family="Arial, sans-serif" font-size="28" font-weight="700">Fixed model · Defense layers</text>
  <text x="60" y="94" fill="#4e5d58" font-family="Arial, sans-serif" font-size="17">The strongest defense removes shell interpretation from the data path.</text>
  <g font-family="Arial, sans-serif">
    <rect x="60" y="140" width="205" height="185" rx="14" fill="#d9f2ee" stroke="#31958d" stroke-width="2"/><text x="162" y="185" text-anchor="middle" fill="#155e59" font-size="20" font-weight="700">1 · No shell</text><text x="162" y="220" text-anchor="middle" fill="#225e5a" font-size="15">Read the log with</text><text x="162" y="246" text-anchor="middle" fill="#225e5a" font-size="15">Node.js APIs</text>
    <rect x="290" y="140" width="205" height="185" rx="14" fill="#e0e9f9" stroke="#5b7db6" stroke-width="2"/><text x="392" y="185" text-anchor="middle" fill="#27436f" font-size="20" font-weight="700">2 · Length</text><text x="392" y="220" text-anchor="middle" fill="#304e80" font-size="15">Reject empty or</text><text x="392" y="246" text-anchor="middle" fill="#304e80" font-size="15">oversized terms</text>
    <rect x="520" y="140" width="205" height="185" rx="14" fill="#f8e7c6" stroke="#bf8235" stroke-width="2"/><text x="622" y="185" text-anchor="middle" fill="#805314" font-size="20" font-weight="700">3 · Allowlist</text><text x="622" y="220" text-anchor="middle" fill="#805314" font-size="15">Accept only simple</text><text x="622" y="246" text-anchor="middle" fill="#805314" font-size="15">search characters</text>
    <rect x="750" y="140" width="190" height="185" rx="14" fill="#e8def5" stroke="#8f6eb4" stroke-width="2"/><text x="845" y="185" text-anchor="middle" fill="#5c3b7e" font-size="20" font-weight="700">4 · Errors</text><text x="845" y="220" text-anchor="middle" fill="#5c3b7e" font-size="15">Return controlled</text><text x="845" y="246" text-anchor="middle" fill="#5c3b7e" font-size="15">responses</text>
  </g>
  <path d="M265 232 H290 M495 232 H520 M725 232 H750" stroke="#71817b" stroke-width="3"/>
</svg>
