<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>log search</title>
<style>
  @font-face {
    font-family: "IBM Plex Mono";
    src: local("IBM Plex Mono");
  }

  :root {
    --bg: #0b0d0e;
    --surface: #12161a;
    --line: #232a2c;
    --text: #d7dbd3;
    --muted: #6d7975;
    --faint: #454f4c;
    --accent: #d9843c;
    --accent-dim: #6b4a26;
  }
  body[data-mode="fixed"] {
    --accent: #3ea6a0;
    --accent-dim: #24504d;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    background: var(--bg);
    background-image:
      radial-gradient(ellipse 900px 500px at 50% -10%, rgba(255,255,255,0.03), transparent);
    color: var(--text);
    font-family: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
    font-size: 14px;
    line-height: 1.6;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 40px 16px;
  }

  .window {
    width: 100%;
    max-width: 680px;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 6px;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    height: min(640px, 82vh);
  }

  .titlebar {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 9px 12px;
    border-bottom: 1px solid var(--line);
    background: #0e1214;
    flex-shrink: 0;
  }
  .dots { display: flex; gap: 6px; }
  .dots span {
    width: 8px; height: 8px; border-radius: 50%;
    background: var(--faint);
  }
  .tab {
    margin-left: 4px;
    font-size: 12px;
    color: var(--muted);
    border-bottom: 1px solid var(--accent);
    padding-bottom: 9px;
    margin-bottom: -10px;
  }
  .tab b { color: var(--text); font-weight: 500; }
  .conn {
    margin-left: auto;
    font-size: 11px;
    color: var(--muted);
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .conn::before {
    content: "";
    width: 6px; height: 6px; border-radius: 50%;
    background: var(--accent);
  }

  .intro {
    padding: 14px 16px 6px;
    color: var(--muted);
    font-size: 12.5px;
    line-height: 1.65;
    border-bottom: 1px solid var(--line);
    flex-shrink: 0;
  }
  .intro code {
    color: var(--text);
    background: rgba(255,255,255,0.04);
    padding: 1px 5px;
    border-radius: 3px;
  }
  .intro .payloads {
    margin-top: 8px;
    display: flex;
    flex-wrap: wrap;
    gap: 6px 10px;
  }
  .intro .payloads button {
    all: unset;
    cursor: pointer;
    color: var(--muted);
    font-family: inherit;
    font-size: 12px;
    border-bottom: 1px dashed var(--faint);
  }
  .intro .payloads button:hover {
    color: var(--accent);
    border-bottom-color: var(--accent);
  }

  .scrollback {
    flex: 1;
    overflow-y: auto;
    padding: 14px 16px;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }
  .scrollback::-webkit-scrollbar { width: 8px; }
  .scrollback::-webkit-scrollbar-thumb { background: var(--line); border-radius: 4px; }

  .entry { animation: rise 160ms ease-out; }
  @keyframes rise {
    from { opacity: 0; transform: translateY(4px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .entry .cmd {
    color: var(--text);
    display: flex;
    gap: 8px;
  }
  .entry .cmd .sigil { color: var(--accent); flex-shrink: 0; }
  .entry .meta {
    color: var(--faint);
    font-size: 11px;
    margin-left: 20px;
    margin-top: 2px;
  }
  .entry .meta.err { color: #b0554a; }
  .entry pre {
    margin: 6px 0 0 20px;
    white-space: pre-wrap;
    word-break: break-word;
    color: #b7bdb4;
    font-size: 13px;
  }
  .entry pre.empty { color: var(--faint); font-style: normal; }

  .promptline {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 12px 16px;
    border-top: 1px solid var(--line);
    flex-shrink: 0;
  }
  .promptline .sigil { color: var(--accent); }
  .promptline input {
    flex: 1;
    background: transparent;
    border: none;
    outline: none;
    color: var(--text);
    font-family: inherit;
    font-size: 14px;
  }
  .promptline input::placeholder { color: var(--faint); }
  .caret {
    width: 7px; height: 15px;
    background: var(--accent);
    animation: blink 1s step-end infinite;
    flex-shrink: 0;
  }
  @keyframes blink { 50% { opacity: 0; } }
</style>
</head>
<body>
  <div class="window">
    <div class="titlebar">
      <div class="dots"><span></span><span></span><span></span></div>
      <div class="tab"><b id="tabName">search</b>.log</div>
      <div class="conn" id="connLabel">connecting</div>
    </div>

    <div class="intro">
      Searches <code>server.log</code> on the backend via <code>grep</code>.
      Type a term below, or try one of these against it —
      <div class="payloads">
        <button data-term="ERROR">ERROR</button>
        <button data-term="ERROR;whoami">ERROR;whoami</button>
        <button data-term="ERROR|whoami">ERROR|whoami</button>
      </div>
    </div>

    <div class="scrollback" id="scrollback"></div>

    <div class="promptline">
      <span class="sigil">❯</span>
      <input id="termInput" type="text" placeholder="search term" autocomplete="off" autofocus>
      <span class="caret"></span>
    </div>
  </div>

<script>
  const scrollback = document.getElementById('scrollback');
  const input = document.getElementById('termInput');
  const tabName = document.getElementById('tabName');
  const connLabel = document.getElementById('connLabel');

  fetch('/mode')
    .then(r => r.json())
    .then(data => {
      document.body.dataset.mode = data.mode;
      tabName.textContent = data.mode;
      connLabel.textContent = data.mode === 'vulnerable' ? 'no validation' : 'validated';
    })
    .catch(() => { connLabel.textContent = 'unreachable'; });

  function timeNow() {
    return new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' });
  }

  async function runSearch(term) {
    const entry = document.createElement('div');
    entry.className = 'entry';
    entry.innerHTML = `
      <div class="cmd"><span class="sigil">❯</span><span>search "${escapeHtml(term)}"</span></div>
      <div class="meta">${timeNow()} · pending…</div>
      <pre></pre>
    `;
    scrollback.appendChild(entry);
    scrollback.scrollTop = scrollback.scrollHeight;

    const meta = entry.querySelector('.meta');
    const pre = entry.querySelector('pre');

    try {
      const res = await fetch('/search?term=' + encodeURIComponent(term));
      const text = await res.text();
      meta.textContent = `${timeNow()} · HTTP ${res.status}`;
      meta.classList.toggle('err', res.status >= 400);
      pre.textContent = text;
      if (!text.trim()) pre.classList.add('empty');
    } catch (err) {
      meta.textContent = `${timeNow()} · request failed`;
      meta.classList.add('err');
      pre.textContent = String(err);
    }
    scrollback.scrollTop = scrollback.scrollHeight;
  }

  function escapeHtml(s) {
    return s.replace(/[&<>"']/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]));
  }

  input.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && input.value.trim()) {
      const term = input.value.trim();
      input.value = '';
      runSearch(term);
    }
  });

  document.querySelectorAll('.payloads button').forEach(btn => {
    btn.addEventListener('click', () => runSearch(btn.dataset.term));
  });

  input.focus();
</script>
</body>
</html>
